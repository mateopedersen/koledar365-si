name: Prepare verified Pages publication
on:
  workflow_dispatch:
  # Daily horoscope HTML and JSON are generated by the existing Pages Functions.
  # Run the complete publication gates for source/content changes and explicit
  # recovery, rather than rebuilding the unchanged site twice every night.
  push:
    branches: [main]
    paths:
      - 'data/editorial/**'
      - 'data/llms-guide.json'
      - 'data/qa-templates.json'
      - 'data/topic_experiences_sl.json'
      - 'public/topics/**'
      - 'lib/seo_publication.rb'
      - 'lib/publication_revisions.rb'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements-qa.txt'
      - 'data/lunar/**'
      - 'data/astronomy/**'
      - 'data/garden/**'
      - 'data/payments/**'
      - 'public/garden/**'
      - 'public/payments/**'
      - 'public/education/**'
      - 'public/school/**'
      - 'public/astronomy/**'
      - 'public/calendar-tools/**'
      - 'public/images/astronomy/**'
      - 'public/images/payments/**'
      - 'public/lunar/**'
      - 'public/prenosi/lunin-koledar/**'
      - 'data/calendar-collection/**'
      - 'public/slike/lunin-koledar/**'
      - 'public/premik-ure/**'
      - 'public/images/premik-ure/**'
      - 'script/lunar/**'
      - 'app/**'
      - 'config/locales/**'
      - 'lib/portable/**'
      - 'lib/horoscope/**'
      - 'data/horoscope/**'
      - 'public/horoscope/**'
      - 'functions/horoskop/**'
      - 'cloudflare/free/**'
      - 'script/**'
      - 'test/test_publication_race.py'
      - 'config/initializers/**'
      - 'config/public_page_redirects.json'
      - 'public/robots.txt'
      - '.github/workflows/pages-publication.yml'
      - 'script/save_pages_publication.sh'
permissions:
  contents: write
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RAILS_ENV: development
      PDFTOPPM_BIN: /usr/bin/pdftoppm
      PYTHON_BIN: /usr/bin/python3
      OPERATOR_CONTACT: koledar365@gmail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils python3-pil
      - name: Install pinned CSS compiler and browser tools
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - name: Rebuild public HTML with Ruby
        run: node script/generate_daily_horoscope.mjs && bundle exec ruby script/rebuild_free.rb && bundle exec ruby script/verify_vector_identity.rb && bundle exec ruby script/verify_mobile_svg_compatibility.rb
      - name: Install release QA dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit firefox
          /usr/bin/python3 -m pip install --break-system-packages -r requirements-qa.txt
      - name: Gate publication on SEO, browser, keyboard, print and download checks
        run: bash script/verify_horoscope_edge.sh && bash script/verify_release_qa.sh
      - name: Keep release QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qa-${{ github.sha }}
          path: |
            evidence/qa/**/*.json
            evidence/qa/**/*.ndjson
            evidence/qa/**/*.csv
            evidence/qa/**/*.txt
            evidence/qa/**/*.md
            test-results/**/*.json
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep vector identity audit details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-identity-audit-${{ github.sha }}
          path: evidence/vector-identity-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save complete verified publication
        run: |
          python3 test/test_publication_race.py
          bash script/save_pages_publication.sh
      # GITHUB_TOKEN pushes do not trigger another push workflow. Keep the
      # live gate in this job so a bot publication cannot miss verification.
      - name: Wait for the exact Cloudflare publication
        run: /usr/bin/python3 script/wait_production.py
      - name: Verify live canonical pages and published assets
        run: /usr/bin/python3 script/qa_seo.py --live --out evidence/qa/live-seo && /usr/bin/python3 script/qa_production.py
      - name: Keep production parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-production-parity-${{ github.sha }}
          path: |
            evidence/qa/live-seo/
            evidence/qa/production/
          if-no-files-found: ignore
          retention-days: 14
