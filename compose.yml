name: koledar365
x-app: &app
  image: ${APP_IMAGE:-koledar365:local}
  build: .
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://koledar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/koledar365
  volumes:
    - exports:/rails/storage
    - logs:/rails/log
  restart: unless-stopped
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: koledar365
      POSTGRES_USER: koledar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U koledar -d koledar365]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *app
    command: [./bin/rails, db:prepare]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: [./bin/jobs]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-koledar365.si}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  database:
  exports:
  logs:
  tls:
  caddy_config:
