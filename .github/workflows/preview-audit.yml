name: Verify Cloudflare preview
on:
  pull_request:
    paths:
      - 'reports/final-audit-2026-10-23/preview-target.json'
      - 'reports/css-performance-2026-10-23/preview-target.json'
      - '.github/workflows/preview-audit.yml'
      - 'script/verify_remote_preview.py'
      - 'script/horoscope_parity.py'
      - 'script/test_horoscope_parity.py'
permissions:
  contents: read
concurrency:
  group: preview-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PREVIEW_TARGET: reports/css-performance-2026-10-23/preview-target.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all preview HTML, CSS, JavaScript and discovery files against trusted hashes
        run: python3 script/test_horoscope_parity.py && python3 script/verify_remote_preview.py "$PREVIEW_TARGET"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Prepare real browser checks
        run: |
          # Keep signed Ubuntu packages, avoiding the stalled Azure mirror.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors-security.txt|https://security.ubuntu.com/ubuntu|g' \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Render every representative template in the preview
        run: |
          export K365_BASE_URL="$(python3 -c "import json; print(json.load(open('reports/css-performance-2026-10-23/preview-target.json'))['url'])")"
          QA_OUT=evidence/qa/preview/css-layout node script/qa_css_layout.mjs
          QA_INTERNAL=1 QA_OUT=evidence/qa/preview/internal-layout node script/qa_css_layout.mjs
          QA_SAMPLE_ONLY=1 QA_OUT=evidence/qa/preview/browser node script/qa_browser.mjs
          QA_MODE=a11y QA_OUT=evidence/qa/preview/accessibility node script/qa_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-preview-${{ github.sha }}
          path: evidence/qa/preview/
          retention-days: 14
