name: Stage verified calendar expansion
on:
  workflow_dispatch:
  push:
    branches: [feat/advanced-calendar-expansion-20261021]
    paths:
      - 'app/**'
      - 'config/**'
      - 'lib/**'
      - 'data/**'
      - 'public/**'
      - 'cloudflare/**'
      - 'functions/**'
      - 'script/**'
      - 'test/**'
      - '.github/workflows/**'
      - 'Gemfile*'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: write
concurrency:
  group: staged-expansion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'mateopedersen/koledar365-si' && github.ref == 'refs/heads/feat/advanced-calendar-expansion-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILS_ENV: development
      PDFTOPPM_BIN: /usr/bin/pdftoppm
      PYTHON_BIN: /usr/bin/python3
      OPERATOR_CONTACT: koledar365@gmail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils python3-pil
      - name: Install pinned CSS compiler and browser tools
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - name: Build and audit the complete static publication
        run: |
          bundle exec ruby script/rebuild_free.rb
          bundle exec ruby -r ./config/environment script/audit_seo.rb
          bundle exec ruby script/verify_vector_identity.rb
          bundle exec ruby script/verify_mobile_svg_compatibility.rb
          ruby script/test_pages_cache_headers.rb
          node script/test_garden_payments.mjs
          node script/test_education.mjs
      - name: Save verified output only to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/advanced-calendar-expansion-20261021'
          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Source branch changed during verification; this build will not overwrite it.'
            exit 1
          fi
          git config user.name 'Koledar365 publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site functions/cities.js data/editorial/pages.json docs/advanced-calendar-live-urls.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Stage verified calendar expansion and complete URL inventory'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staged-expansion-${{ github.sha }}
          path: |
            evidence/*.json
            docs/advanced-calendar-live-urls.txt
            site/release-urls.json
          retention-days: 14
