name: Verify Cloudflare production publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/release-manifest.json']
permissions:
  contents: read
concurrency:
  group: production-parity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the exact Cloudflare publication
        run: python3 script/wait_production.py
      - name: Audit every published image for live indexing eligibility
        run: python3 script/audit_public_images.py --out evidence/qa/live-image-indexability
      - name: Verify all canonical pages and published CSS and JavaScript
        run: python3 script/qa_seo.py --live && python3 script/qa_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-parity-${{ github.sha }}
          path: evidence/qa/
          retention-days: 14
