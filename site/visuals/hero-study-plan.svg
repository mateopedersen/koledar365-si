      <feOffset dx="4" dy="12" result="shadow" />
      <feFlood flood-color="#19304d" flood-opacity=".21" />
      <feComposite in2="shadow" operator="in" />
    </filter>
    <filter id="lift" x="-.35" y="-.4" width="1.75" height="2">
