name: Prepare verified Pages publication
on:
  workflow_dispatch:
  schedule:
    - cron: '15 22,23 * * *'
  push:
    branches: [main]
    paths:
      - 'data/editorial/**'
      - 'data/lunar/**'
      - 'public/lunar/**'
      - 'public/prenosi/lunin-koledar/**'
      - 'public/slike/lunin-koledar/**'
      - 'script/lunar/**'
      - 'app/**'
      - 'config/locales/**'
      - 'lib/portable/**'
permissions:
  contents: write
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILS_ENV: development
      PDFTOPPM_BIN: /usr/bin/pdftoppm
      PYTHON_BIN: /usr/bin/python3
      OPERATOR_CONTACT: koledar365@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils python3-pil
      - name: Rebuild public HTML with Ruby
        run: bundle exec ruby script/rebuild_free.rb && bundle exec ruby script/verify_vector_identity.rb
      - name: Save complete verified publication
        run: |
          git config user.name 'Koledar365 publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site functions/cities.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified calendar and dated editorial content'
          git push origin HEAD:main
