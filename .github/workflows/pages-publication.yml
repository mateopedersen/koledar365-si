name: Prepare verified Pages publication
on:
  workflow_dispatch:
  schedule:
    - cron: '15 22,23 * * *'
  push:
    branches: [main]
    paths:
      - 'data/editorial/**'
      - 'data/lunar/**'
      - 'data/astronomy/**'
      - 'data/garden/**'
      - 'data/payments/**'
      - 'public/garden/**'
      - 'public/payments/**'
      - 'public/education/**'
      - 'public/school/**'
      - 'public/astronomy/**'
      - 'public/calendar-tools/**'
      - 'public/images/astronomy/**'
      - 'public/images/payments/**'
      - 'public/lunar/**'
      - 'public/prenosi/lunin-koledar/**'
      - 'data/calendar-collection/**'
      - 'public/slike/lunin-koledar/**'
      - 'public/premik-ure/**'
      - 'public/images/premik-ure/**'
      - 'script/lunar/**'
      - 'app/**'
      - 'config/locales/**'
      - 'lib/portable/**'
      - 'lib/horoscope/**'
      - 'data/horoscope/**'
      - 'public/horoscope/**'
      - 'functions/horoskop/**'
      - 'cloudflare/free/**'
      - 'script/**'
      - 'config/initializers/**'
      - 'config/public_page_redirects.json'
      - 'public/robots.txt'
      - '.github/workflows/pages-publication.yml'
      - 'script/save_pages_publication.sh'
permissions:
  contents: write
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILS_ENV: development
      PDFTOPPM_BIN: /usr/bin/pdftoppm
      PYTHON_BIN: /usr/bin/python3
      OPERATOR_CONTACT: koledar365@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils python3-pil
      - name: Rebuild public HTML with Ruby
        run: node script/generate_daily_horoscope.mjs && bundle exec ruby script/rebuild_free.rb && bundle exec ruby script/verify_vector_identity.rb && bundle exec ruby script/verify_mobile_svg_compatibility.rb
      - name: Keep vector identity audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-identity-audit-${{ github.sha }}
          path: evidence/vector-identity-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save complete verified publication
        run: |
          bash script/save_pages_publication.sh
